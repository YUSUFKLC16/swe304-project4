apiVersion: apps/v1
kind: Deployment
metadata:
  name: swe304-project4-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swe304-project4
  template:
    metadata:
      labels:
        app: swe304-project4
    spec:
      containers:
        - name: swe304-project4
          image: yusufbugrakilic1907/swe304-project4:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080